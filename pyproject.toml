[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euclid-mcp"
version = "0.5.0"
description = "MCP server for deterministic logical reasoning via Prolog — transforms facts into formal proofs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Euclid-MCP contributors" }
]
keywords = ["mcp", "prolog", "reasoning", "logic", "proof-trees", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.0",
    "ollama>=0.6.2",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "pre-commit",
]

[project.urls]
homepage = "https://github.com/Euclid-BG/Euclid-MCP"
repository = "https://github.com/Euclid-BG/Euclid-MCP"

[project.scripts]
euclid-mcp = "euclid_mcp:main"
euclid-cli = "euclid_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["euclid_mcp*"]

[tool.setuptools.package-data]
euclid_mcp = ["*.pl"]

[tool.pytest.ini_options]
testpaths = ["tests", "euclid-lsp/tests"]
pythonpath = [".", "euclid-lsp/src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E501"]
"benchmarks/**" = ["E501"]
"examples/10_llm_vs_euclid/**" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.report]
fail_under = 80

[tool.uv.workspace]
members = ["euclid-lsp"]

[tool.uv.sources]
euclid-mcp = { workspace = true }
